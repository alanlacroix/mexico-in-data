name: release-check

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    # Background data commits are validated before they are written and deliberately
    # do not deploy. Editorial commits also live under data/, so a blanket path ignore
    # would incorrectly skip their release check; use the explicit commit marker.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[CF-Pages-Skip]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build and validate the production artifact
        run: npm run release

      - name: Preserve the validated artifact for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mexico-brief-${{ github.sha }}
          path: _site/
          if-no-files-found: error
          retention-days: 14

  source-audit:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Check core sources from the production runner environment
        run: node pipeline/audit-sources.mjs > source-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-audit-${{ github.sha }}
          path: source-audit.json
          if-no-files-found: error
          retention-days: 14
