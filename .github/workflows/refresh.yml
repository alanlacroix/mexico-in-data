name: refresh-data
# Refresh the homepage numbers and its news/context inputs. Nothing in this job
# exists solely for a secondary page.

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours (fuel + rates + context)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: mexico-brief-production-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run pipeline
        working-directory: pipeline
        env:
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node run.js

      - name: Reconcile freshness labels against observation periods
        working-directory: pipeline
        run: node sync-freshness.js

      - name: Collect multi-source news
        working-directory: pipeline
        continue-on-error: true   # any dead feed is skipped; never fails the run
        run: node collect-news.js

      # Background refreshes are factual and model-free. The daily publication owns
      # the entire model allowance: source-language curation, Briefly Explained, and
      # translation of the exact Spanish Brief. Optional cache prose can no longer
      # spend the money required to publish the product itself.

      - name: Keep the brief's fallback readings aligned with refreshed series
        run: node pipeline/sync-brief-standing.js

      - name: Validate the assembled public data before committing it
        run: node pipeline/assert-data.js

      - name: Commit refreshed data
        run: |
          git config user.name  "mexico-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "[CF-Pages-Skip] data: scheduled refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          # An editorial session pushing while this runs used to fail the whole refresh on a
          # non-fast-forward (it did, 2026-08-02 19:31). The machine owns data/, so rebasing
          # onto whatever landed and trying again is always the right move.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main (attempt $attempt)"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "could not push refreshed data after 5 attempts"
          exit 1

      - name: Open issue on connector failures
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'pipeline/alerts.json';
            if (!fs.existsSync(path)) return;
            const alerts = JSON.parse(fs.readFileSync(path, 'utf8'));
            // Only escalate real errors (missing tokens are expected until set).
            const real = alerts.filter(a => a.severity === 'error' &&
              !/missing .*_TOKEN|gated by|disabled this cycle/i.test(a.message));
            if (!real.length) return;
            const body = real.map(a => `- **${a.id}** (${a.source}): ${a.message}`).join('\n');
            const title = `Data pipeline: ${real.length} connector failure(s)`;
            // The SAME failure recurring every run used to post a comment each time, which
            // emails a notification on every cycle (Alan 2026-07-19: "I keep getting these").
            // Now: fingerprint the failure set. An unchanged set silently refreshes the issue
            // body (edits do not notify); only a CHANGED set posts a comment worth an email.
            const crypto = require('crypto');
            const sig = crypto.createHash('sha1')
              .update(real.map(a => `${a.id}:${a.message}`).sort().join('|')).digest('hex').slice(0, 12);
            const marker = `<!-- failure-set:${sig} -->`;
            const stamped = `${body}\n\n_Still failing as of ${new Date().toISOString()}._\n${marker}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'data-alert',
            });
            if (open[0]) {
              const unchanged = (open[0].body || '').includes(marker);
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, title, body: stamped });
              if (!unchanged) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body: `Failure set changed ${new Date().toISOString()}:\n${body}` });
              }
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, labels: ['data-alert'], body: stamped });
            }
