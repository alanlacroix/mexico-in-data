name: refresh-data
# The number path — deterministic code only, no LLM. Fetches every connector,
# validates + fails closed, commits the refreshed static JSON. The public site
# (Cloudflare/GitHub Pages) redeploys on the push. IMSS is skipped here (it has
# its own monthly workflow); its ENABLE_IMSS gate keeps it off this cadence.

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours (fuel + rates + context)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: mexico-brief-production-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run pipeline
        working-directory: pipeline
        env:
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node run.js

      - name: Reconcile freshness labels against observation periods
        working-directory: pipeline
        run: node sync-freshness.js

      - name: Build the Trade section (COMTRADE + World Bank, reconciled to Banxico)
        working-directory: pipeline
        continue-on-error: true   # external APIs; reconcile-or-drop keeps last-good, never fails the run
        run: node fetch-trade.js

      - name: Keep export drill-down aligned with the validated annual basket
        working-directory: pipeline
        continue-on-error: true   # cached for 30 days; a failed refresh keeps the last-good detail file
        run: node fetch-hs4.js

      - name: Build the analysis facts pack (The Read)
        working-directory: pipeline
        continue-on-error: true   # deterministic, reads local JSON; a miss keeps last-good
        run: node build-analysis.js

      - name: Log the historical vintage store (Supabase)
        working-directory: pipeline
        continue-on-error: true   # fail-soft; no-op without SUPABASE secrets, never blocks deploy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: node db-sync.js

      - name: Build the news wire (Q12)
        working-directory: pipeline
        continue-on-error: true   # GDELT is flaky; a miss must not fail the run — the site fail-closes
        run: node build-news.js

      - name: Collect multi-source news (RSS ledger + wire)
        working-directory: pipeline
        continue-on-error: true   # any dead feed is skipped; never fails the run
        run: node collect-news.js

      - name: Decide whether the model runs this refresh
        id: modelgate
        # The data connectors run every 6 hours; the model jobs do not need to. The wire,
        # the economy notes and the calendar lines change on a daily rhythm at most, so
        # paying for a model pass on all ~6.7 daily refreshes bought nothing. One window a
        # day (the 12:17 UTC run), plus any manual dispatch.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "manual dispatch — model jobs on"
          elif [ "$(date -u +%H)" = "12" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "daily model window — model jobs on"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "outside the daily model window — skipping model jobs"
          fi

      - name: Write the lines the feed cannot compute
        working-directory: pipeline
        if: steps.modelgate.outputs.run == 'true'
        continue-on-error: true   # a missing sentence never fails a refresh; the feed keeps its factual fallback
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node write-context.mjs

      - name: Put the wire into English
        working-directory: pipeline
        if: steps.modelgate.outputs.run == 'true'
        continue-on-error: true   # a translation miss never fails a refresh; the wire is publishable as collected
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node translate-wire.mjs

      - name: Capture article bodies into the store (before links rot)
        working-directory: pipeline
        continue-on-error: true   # best-effort; a miss never fails the data run. No-op without the SUPABASE secrets.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node archive-bodies.js

      - name: Build the Tariff & USMCA Watch
        working-directory: pipeline
        continue-on-error: true   # external feed; a miss keeps last-good, never fails the run
        run: node build-tariffs.js

      - name: Build US–Mexico trade (Census)
        working-directory: pipeline
        continue-on-error: true   # external API; a miss keeps last-good, never fails the run
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: node build-trade.js

      - name: Bank today's snapshot (delta history — cannot be backfilled)
        working-directory: pipeline
        continue-on-error: true   # never fails the run
        run: node snapshot.js

      - name: Keep the brief's fallback readings aligned with refreshed series
        run: node pipeline/sync-brief-standing.js

      - name: Validate the assembled public data before committing it
        run: node pipeline/assert-data.js

      - name: Commit refreshed data
        run: |
          git config user.name  "mexico-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "[CF-Pages-Skip] data: scheduled refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          # An editorial session pushing while this runs used to fail the whole refresh on a
          # non-fast-forward (it did, 2026-08-02 19:31). The machine owns data/, so rebasing
          # onto whatever landed and trying again is always the right move.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main (attempt $attempt)"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "could not push refreshed data after 5 attempts"
          exit 1

      - name: Open issue on connector failures
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'pipeline/alerts.json';
            if (!fs.existsSync(path)) return;
            const alerts = JSON.parse(fs.readFileSync(path, 'utf8'));
            // Only escalate real errors (missing tokens are expected until set).
            const real = alerts.filter(a => a.severity === 'error' &&
              !/missing .*_TOKEN|gated by|disabled this cycle/i.test(a.message));
            if (!real.length) return;
            const body = real.map(a => `- **${a.id}** (${a.source}): ${a.message}`).join('\n');
            const title = `Data pipeline: ${real.length} connector failure(s)`;
            // The SAME failure recurring every run used to post a comment each time, which
            // emails a notification on every cycle (Alan 2026-07-19: "I keep getting these").
            // Now: fingerprint the failure set. An unchanged set silently refreshes the issue
            // body (edits do not notify); only a CHANGED set posts a comment worth an email.
            const crypto = require('crypto');
            const sig = crypto.createHash('sha1')
              .update(real.map(a => `${a.id}:${a.message}`).sort().join('|')).digest('hex').slice(0, 12);
            const marker = `<!-- failure-set:${sig} -->`;
            const stamped = `${body}\n\n_Still failing as of ${new Date().toISOString()}._\n${marker}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'data-alert',
            });
            if (open[0]) {
              const unchanged = (open[0].body || '').includes(marker);
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, title, body: stamped });
              if (!unchanged) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body: `Failure set changed ${new Date().toISOString()}:\n${body}` });
              }
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, labels: ['data-alert'], body: stamped });
            }
