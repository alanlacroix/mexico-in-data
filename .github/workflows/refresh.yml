name: refresh-data
# Refresh the homepage numbers and its news/context inputs. Nothing in this job
# exists solely for a secondary page.

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours (fuel + rates + context)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: mexico-brief-production-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run pipeline
        working-directory: pipeline
        env:
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node run.js

      - name: Reconcile freshness labels against observation periods
        working-directory: pipeline
        run: node sync-freshness.js

      - name: Collect multi-source news
        working-directory: pipeline
        continue-on-error: true   # any dead feed is skipped; never fails the run
        run: node collect-news.js

      - name: Decide whether the model runs this refresh
        id: modelgate
        # State-based, not clock-based (rewritten 2026-08-04). This used to fire only when
        # the UTC hour was exactly 12, which quietly meant never: GitHub's scheduler does
        # not land this workflow near its cron slot. Over 2026-08-01..04 a ':17' cron
        # actually ran at :51, :34, :54, :12, :03 and :51, and not one run fell in hour 12,
        # so write-context.mjs had not run on a schedule since. The site kept publishing,
        # just with the previous day's authored lines, which is exactly the kind of silent
        # staleness this repo is supposed to refuse.
        #
        # So ask the question that actually matters: has the model pass happened today?
        # The first refresh of each UTC day takes the window, whenever GitHub grants it.
        # Same one pass a day, same cost, no dependence on a clock we do not control.
        run: |
          TODAY=$(date -u +%F)
          STAMP=$(sed -n 's/.*"date"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' data/model-window.json 2>/dev/null | head -1)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "manual dispatch — model jobs on"
          elif [ "$STAMP" != "$TODAY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "first refresh of $TODAY — model jobs on"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "model window already used today ($STAMP) — skipping model jobs"
          fi

      - name: Write the lines the feed cannot compute
        id: context
        working-directory: pipeline
        if: steps.modelgate.outputs.run == 'true'
        continue-on-error: true   # a missing sentence never fails a refresh; the feed keeps its factual fallback
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node write-context.mjs

      # The window is recorded as used only once the work actually succeeded. Stamping on
      # the attempt instead would let one transient API error cost a whole day of authored
      # lines, which is the staleness this rewrite exists to stop. On failure the next
      # refresh simply tries again, so a bad day costs at most a few more attempts.
      - name: Record that today's model window was used
        if: steps.modelgate.outputs.run == 'true' && steps.context.outcome == 'success'
        run: printf '{"date":"%s"}\n' "$(date -u +%F)" > data/model-window.json

      # Deliberately NOT behind modelgate. The gate exists for jobs that regenerate the
      # same content on a daily rhythm, where extra runs buy nothing. These two are
      # different in kind: they are incremental caches whose work is proportional to what
      # collect-news just brought in, and collect-news runs on all four daily refreshes.
      # Gating them meant anything collected at 18:17, 00:17 or 06:17 UTC sat untranslated
      # for up to 18 hours — English headlines on the Spanish edition, which is what Alan
      # saw on 2026-08-03. Cost of ungating is the system prompt three more times a day
      # (~$0.06/month): the strings translated per day are the same either way, only split
      # into smaller batches. When the cache is current both scripts exit without an API
      # call, so a quiet refresh still costs nothing.
      - name: Fill the Spanish edition's translation cache
        working-directory: pipeline
        continue-on-error: true   # a miss carries the last complete Spanish Brief and omits optional untranslated copy
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node translate-es.mjs

      - name: Put the wire into English
        working-directory: pipeline
        continue-on-error: true   # a miss omits ES items from EN and keeps their native copy on /es/
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node translate-wire.mjs

      - name: Keep the brief's fallback readings aligned with refreshed series
        run: node pipeline/sync-brief-standing.js

      - name: Validate the assembled public data before committing it
        run: node pipeline/assert-data.js

      - name: Commit refreshed data
        run: |
          git config user.name  "mexico-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "[CF-Pages-Skip] data: scheduled refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          # An editorial session pushing while this runs used to fail the whole refresh on a
          # non-fast-forward (it did, 2026-08-02 19:31). The machine owns data/, so rebasing
          # onto whatever landed and trying again is always the right move.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main (attempt $attempt)"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "could not push refreshed data after 5 attempts"
          exit 1

      - name: Open issue on connector failures
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'pipeline/alerts.json';
            if (!fs.existsSync(path)) return;
            const alerts = JSON.parse(fs.readFileSync(path, 'utf8'));
            // Only escalate real errors (missing tokens are expected until set).
            const real = alerts.filter(a => a.severity === 'error' &&
              !/missing .*_TOKEN|gated by|disabled this cycle/i.test(a.message));
            if (!real.length) return;
            const body = real.map(a => `- **${a.id}** (${a.source}): ${a.message}`).join('\n');
            const title = `Data pipeline: ${real.length} connector failure(s)`;
            // The SAME failure recurring every run used to post a comment each time, which
            // emails a notification on every cycle (Alan 2026-07-19: "I keep getting these").
            // Now: fingerprint the failure set. An unchanged set silently refreshes the issue
            // body (edits do not notify); only a CHANGED set posts a comment worth an email.
            const crypto = require('crypto');
            const sig = crypto.createHash('sha1')
              .update(real.map(a => `${a.id}:${a.message}`).sort().join('|')).digest('hex').slice(0, 12);
            const marker = `<!-- failure-set:${sig} -->`;
            const stamped = `${body}\n\n_Still failing as of ${new Date().toISOString()}._\n${marker}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'data-alert',
            });
            if (open[0]) {
              const unchanged = (open[0].body || '').includes(marker);
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, title, body: stamped });
              if (!unchanged) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body: `Failure set changed ${new Date().toISOString()}:\n${body}` });
              }
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, labels: ['data-alert'], body: stamped });
            }
