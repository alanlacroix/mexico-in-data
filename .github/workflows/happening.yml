name: edition

# One command owns publication. 14:23 and 17:23 UTC fall inside the builder's
# accepted morning/noon Eastern windows in both standard and daylight time. The
# Cloudflare clock is primary; these two runs are the independent scheduler backup.
on:
  schedule:
    - cron: '23 14,17 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: Edition slot
        required: true
        default: morning
        type: choice
        options: [morning, noon]

permissions:
  contents: write

concurrency:
  group: mexico-brief-production-write
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    # Absolute feed/article/model deadlines plus two bounded deploy verifications fit
    # under this ceiling. The old 15-minute cap could kill a correct recovery run.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build one atomic bilingual edition
        id: edition
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBLICATION_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || '' }}
        run: node pipeline/build-edition.mjs

      - name: Build and validate the exact site before publication
        id: release
        if: steps.edition.outcome == 'success' && steps.edition.outputs.state == 'published'
        continue-on-error: true
        run: npm run release

      - name: Persist the result without publishing partial work
        id: persist
        if: always()
        env:
          EDITION_STATE: ${{ steps.edition.outputs.state }}
          EDITORIAL_DATE: ${{ steps.edition.outputs.editorial_date }}
          EDITION_OUTCOME: ${{ steps.edition.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "mexico-data-bot"
          git config user.email "actions@users.noreply.github.com"
          gh auth setup-git
          if [ "$EDITION_OUTCOME" = "success" ] && [ "$EDITION_STATE" = "published" ] && [ "$RELEASE_OUTCOME" = "success" ]; then
            git add data/edition.json data/edition-attempts.json data/llm-spend.json data/news/
            message="edition: ${EDITORIAL_DATE} published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            git add data/edition-attempts.json data/llm-spend.json
            message="[CF-Pages-Skip] edition: ${EDITORIAL_DATE:-unknown} ${EDITION_STATE:-failed}"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --cached --quiet; then
            echo "no edition-state change"
            exit 0
          fi
          git commit -m "$message"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase --autostash origin main || exit 1
          done
          exit 1

      - name: Fail loudly when generation or the release gate failed
        if: steps.edition.outcome == 'failure' || steps.edition.outputs.state == 'failed' || steps.release.outcome == 'failure'
        run: exit 1

      - name: Verify the exact artifact reached production
        id: production
        if: steps.persist.outputs.published == 'true'
        continue-on-error: true
        env:
          EDITORIAL_DATE: ${{ steps.edition.outputs.editorial_date }}
          ARTIFACT_HASH: ${{ steps.edition.outputs.artifact_hash }}
        run: node pipeline/verify-production.mjs

      - name: Retry deployment once without rerunning editorial generation
        if: steps.persist.outputs.published == 'true' && steps.production.outcome == 'failure'
        env:
          EDITORIAL_DATE: ${{ steps.edition.outputs.editorial_date }}
          ARTIFACT_HASH: ${{ steps.edition.outputs.artifact_hash }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git commit --allow-empty -m "deploy: retry edition ${EDITORIAL_DATE} ${ARTIFACT_HASH}"
          git push origin HEAD:main
          node pipeline/verify-production.mjs
