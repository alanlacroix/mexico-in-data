name: edition

# Start at 06:05 Mexico City, with recovery time before the 07:00 target.
# Backups at 06:20 and 06:40
# also recover one failed attempt; the persisted ledger caps retries and spend.
on:
  schedule:
    - cron: '20 12 * * *'
    - cron: '40 12 * * *'
  workflow_run:
    workflows: [release-check]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      slot:
        description: Edition slot
        required: true
        default: morning
        type: choice
        options: [morning, noon]
      weekend_recovery:
        description: Explicitly build a reviewed weekend recovery candidate
        required: false
        default: false
        type: boolean
      retry_failed:
        description: Retry the one failed slot once while preserving its ledger and spend
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: mexico-brief-production-write
  cancel-in-progress: false

jobs:
  edition:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    # Absolute feed/article/model deadlines plus two bounded deploy verifications fit
    # under this ceiling. The old 15-minute cap could kill a correct recovery run.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Plan a bounded daily attempt or recovery
        id: plan
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          REQUESTED_SLOT: ${{ inputs.slot || 'morning' }}
          REQUESTED_RECOVERY: ${{ inputs.retry_failed && 'true' || 'false' }}
        run: node pipeline/publication-plan.mjs

      - name: Prepare durable model accounting
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "mexico-data-bot"
          git config user.email "actions@users.noreply.github.com"
          gh auth setup-git

      - name: Build one atomic bilingual edition
        id: edition
        if: steps.plan.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBLICATION_SLOT: ${{ steps.plan.outputs.slot }}
          EDITION_REQUIRE_REVIEW: '0'
          EDITION_WEEKEND_RECOVERY: '1'
          EDITION_RETRY_FAILED: ${{ steps.plan.outputs.retry }}
        run: node pipeline/build-edition.mjs

      - name: Build and validate the exact site before publication
        id: release
        if: steps.edition.outcome == 'success' && steps.edition.outputs.state == 'published'
        continue-on-error: true
        run: npm run release

      - name: Preserve audited edition after a release rejection
        if: always() && steps.edition.outputs.state == 'published' && steps.release.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: held-edition-${{ steps.edition.outputs.editorial_date }}-${{ steps.edition.outputs.slot }}
          path: data/edition.json
          retention-days: 7

      - name: Record release rejection as a failed attempt
        if: always() && steps.edition.outputs.state == 'published' && steps.release.outcome != 'success'
        env:
          EDITORIAL_DATE: ${{ steps.edition.outputs.editorial_date }}
          PUBLICATION_SLOT: ${{ steps.edition.outputs.slot }}
        run: node pipeline/record-release-failure.mjs

      - name: Persist the result without publishing partial work
        id: persist
        if: always() && steps.plan.outputs.run == 'true'
        env:
          EDITION_STATE: ${{ steps.edition.outputs.state }}
          EDITORIAL_DATE: ${{ steps.edition.outputs.editorial_date }}
          EDITION_OUTCOME: ${{ steps.edition.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "mexico-data-bot"
          git config user.email "actions@users.noreply.github.com"
          gh auth setup-git
          if [ "$EDITION_OUTCOME" = "success" ] && [ "$EDITION_STATE" = "published" ] && [ "$RELEASE_OUTCOME" = "success" ]; then
            git add data/edition.json data/edition-attempts.json data/llm-spend.json data/editions/ data/news/
            message="edition: ${EDITORIAL_DATE} published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif [ "$EDITION_OUTCOME" = "success" ] && [ "$EDITION_STATE" = "review-required" ]; then
            git add data/candidates/ data/edition-attempts.json data/llm-spend.json data/news/
            message="[CF-Pages-Skip] edition: ${EDITORIAL_DATE} review required"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git add data/edition-attempts.json data/llm-spend.json data/news/ data/candidates/
            if [ "$RELEASE_OUTCOME" = "failure" ]; then EDITION_STATE="release-failed"; fi
            message="[CF-Pages-Skip] edition: ${EDITORIAL_DATE:-unknown} ${EDITION_STATE:-failed}"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --cached --quiet; then
            echo "no edition-state change"
            exit 0
          fi
          git commit -m "$message"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase --autostash origin main || exit 1
          done
          exit 1

      - name: Fail loudly when generation or the release gate failed
        if: steps.edition.outcome == 'failure' || steps.edition.outputs.state == 'failed' || steps.release.outcome == 'failure'
        run: |
          node pipeline/failure-summary.mjs
          exit 1

      - name: Mark candidate as awaiting human review
        if: steps.edition.outcome == 'success' && steps.edition.outputs.state == 'review-required'
        env:
          EDITORIAL_DATE: ${{ steps.edition.outputs.editorial_date }}
          PUBLICATION_SLOT: ${{ steps.edition.outputs.slot }}
        run: node pipeline/review-summary.mjs

      - name: Preserve candidate for editorial review
        if: steps.edition.outcome == 'success' && steps.edition.outputs.state == 'review-required'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ steps.edition.outputs.editorial_date }}-${{ steps.edition.outputs.slot }}
          path: data/candidates/
          retention-days: 14

      - name: Verify the exact artifact reached production
        id: production
        if: steps.persist.outputs.published == 'true' || steps.plan.outputs.verify == 'true'
        continue-on-error: true
        env:
          EDITORIAL_DATE: ${{ steps.edition.outputs.editorial_date || steps.plan.outputs.editorial_date }}
          ARTIFACT_HASH: ${{ steps.edition.outputs.artifact_hash || steps.plan.outputs.artifact_hash }}
        run: node pipeline/verify-production.mjs

      - name: Retry deployment once without rerunning editorial generation
        if: (steps.persist.outputs.published == 'true' || steps.plan.outputs.verify == 'true') && steps.production.outcome == 'failure'
        env:
          EDITORIAL_DATE: ${{ steps.edition.outputs.editorial_date || steps.plan.outputs.editorial_date }}
          ARTIFACT_HASH: ${{ steps.edition.outputs.artifact_hash || steps.plan.outputs.artifact_hash }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name mexico-data-bot
          git config user.email actions@users.noreply.github.com
          node pipeline/claim-deployment-retry.mjs
          git add data/edition-attempts.json
          git commit -m "deploy: retry edition ${EDITORIAL_DATE} ${ARTIFACT_HASH}"
          git push origin HEAD:main
          node pipeline/verify-production.mjs
