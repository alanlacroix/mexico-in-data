name: happening
# The only workflow that publishes the homepage brief. It gets several chances to
# run in each editorial window, but the committed publication receipt makes each
# window idempotent. Every workflow that writes to main shares the concurrency
# group below, so a data refresh cannot race this commit again.

on:
  schedule:
    # Run hourly and let the gate decide. This is deliberate, and it replaced four
    # precise cron minutes on 2026-08-04 after Alan hit a third late morning in a row.
    #
    # GitHub's scheduler is best-effort and, for this repo, is not merely late: over
    # 2026-08-01..04 the every-6-hours refresh (cron ':17') actually fired at :51, :34,
    # :54, :12, :03 and :51, hours from its slot, and the morning edition cron was
    # dropped outright on the 3rd and the 4th. Asking that scheduler to hit 13:07 UTC
    # was the bug. No number of extra precise crons fixes an unreliable clock.
    #
    # pipeline/editorial-gate.mjs is already state-based rather than clock-based: it
    # refuses before 9am Eastern and refuses again once the day's receipt exists. So an
    # hourly attempt is free (the gate exits in seconds) and the edition now publishes on
    # the first runner GitHub grants after 9am Eastern instead of waiting for a specific
    # minute that may never come.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Republish even if the repository receipt is current
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: mexico-brief-production-write
  cancel-in-progress: false

jobs:
  happening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Decide whether this edition is still due
        id: timing
        env:
          FORCE_PUBLICATION: ${{ github.event.inputs.force || 'false' }}
        run: node pipeline/editorial-gate.mjs

      - name: Install exact dependencies
        if: steps.timing.outputs.run == 'true'
        run: npm ci

      - name: Refresh the news ledger
        if: steps.timing.outputs.run == 'true'
        working-directory: pipeline
        run: node collect-news.js

      - name: Build the event log
        if: steps.timing.outputs.run == 'true'
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Selection must happen before explanation work. Otherwise this step guesses
        # which five stories will matter, spends the analysis slots, and can miss the
        # exact stories the Brief chooses a few seconds later.
        run: node build-happening.js --skip-analysis --resume-current-edition

      - name: Reconcile scheduled outcomes
        if: steps.timing.outputs.run == 'true'
        working-directory: pipeline
        env:
          EDITORIAL_DATE: ${{ steps.timing.outputs.editorial_date }}
        run: node reconcile-scheduled-events.mjs

      - name: Lock the homepage story selection
        if: steps.timing.outputs.run == 'true'
        working-directory: pipeline
        run: node build-brief.js --selection-only

      - name: Explain the stories that were actually selected
        if: steps.timing.outputs.run == 'true'
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node build-happening.js --analysis-for-brief

      - name: Build the homepage brief
        if: steps.timing.outputs.run == 'true'
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node build-brief.js

      - name: Require a complete English Brief before optional translation
        if: steps.timing.outputs.run == 'true'
        run: node pipeline/assert-data.js

      - name: Translate the new edition for /es/
        if: steps.timing.outputs.run == 'true'
        working-directory: pipeline
        continue-on-error: true   # a miss carries the last complete Spanish Brief; it never mixes languages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node translate-es.mjs --critical

      # Topic-list translations are useful, but they are not allowed to run until the
      # Brief and its complete Spanish snapshot have had first access to the budget.
      - name: Translate new topic stories after the Brief
        if: steps.timing.outputs.run == 'true'
        working-directory: pipeline
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node translate-wire.mjs

      - name: Fill optional Spanish homepage translations after the Brief
        if: steps.timing.outputs.run == 'true'
        working-directory: pipeline
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node translate-es.mjs

      - name: Validate generated editorial claims
        if: steps.timing.outputs.run == 'true'
        run: |
          node pipeline/assert-data.js
          node pipeline/test/homepage-feed-contract.test.mjs

      - name: Write this edition's publication receipt
        if: steps.timing.outputs.run == 'true'
        env:
          PUBLICATION_SLOT: ${{ steps.timing.outputs.slot }}
          PUBLICATION_DATE: ${{ steps.timing.outputs.editorial_date }}
          PUBLICATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node pipeline/write-publication-status.mjs

      - name: Build and validate the exact production artifact
        if: steps.timing.outputs.run == 'true'
        run: npm run release

      # One failed run records a durable circuit breaker. Normal hourly schedules then
      # exit successfully instead of repeating the same failure and email. The external
      # watchdog still gets one forced recovery attempt; a successful publication clears
      # the marker in the final atomic commit.
      - name: Record a blocked publication once
        if: failure() && steps.timing.outputs.run == 'true'
        env:
          PUBLICATION_DATE: ${{ steps.timing.outputs.editorial_date }}
          PUBLICATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node pipeline/record-publication-block.mjs
          git config user.name  "mexico-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/llm-spend.json ops/publication-block.json
          git commit -m "ops: block repeated publication failure for ${PUBLICATION_DATE}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase --autostash origin main || exit 1
          done
          exit 1

      - name: Commit and push the edition once
        if: steps.timing.outputs.run == 'true'
        env:
          PUBLICATION_SLOT: ${{ steps.timing.outputs.slot }}
          PUBLICATION_DATE: ${{ steps.timing.outputs.editorial_date }}
        run: |
          node pipeline/clear-publication-block.mjs
          git config user.name  "mexico-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news/ data/happening.json data/event-status.json data/brief.json data/publication-status.json data/llm-spend.json data/es/
          git add -u ops/
          git commit -m "publication: ${PUBLICATION_DATE} ${PUBLICATION_SLOT} edition"
          # A single push attempt used to lose the whole publication to a non-fast-forward
          # whenever anything else landed on main mid-run (2026-08-02 22:14: the edition
          # published, then the run died here). The machine owns these paths, so rebasing
          # onto whatever arrived and trying again is always right.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main (attempt $attempt)"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "could not push the edition after 5 attempts"
          exit 1

      - name: Require the exact edition to be live
        if: steps.timing.outputs.run == 'true'
        id: live
        continue-on-error: true
        env:
          PUBLICATION_SLOT: ${{ steps.timing.outputs.slot }}
          PUBLICATION_DATE: ${{ steps.timing.outputs.editorial_date }}
          PUBLICATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node pipeline/verify-production.mjs

      - name: Retrigger deployment once if production is stale
        if: steps.timing.outputs.run == 'true' && steps.live.outcome == 'failure'
        env:
          PUBLICATION_SLOT: ${{ steps.timing.outputs.slot }}
          PUBLICATION_DATE: ${{ steps.timing.outputs.editorial_date }}
          PUBLICATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOY_ATTEMPT: '2'
        run: |
          node pipeline/write-publication-status.mjs
          git add data/publication-status.json
          git commit -m "publication: retry ${PUBLICATION_DATE} ${PUBLICATION_SLOT} deployment"
          git push origin HEAD:main
          node pipeline/verify-production.mjs
