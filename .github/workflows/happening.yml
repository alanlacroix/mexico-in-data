name: happening
# The only workflow that publishes the homepage brief. It gets several chances to
# run in each editorial window, but the committed publication receipt makes each
# window idempotent. Every workflow that writes to main shares the concurrency
# group below, so a data refresh cannot race this commit again.

on:
  schedule:
    # Run hourly and let the gate decide. This is deliberate, and it replaced four
    # precise cron minutes on 2026-08-04 after Alan hit a third late morning in a row.
    #
    # GitHub's scheduler is best-effort and, for this repo, is not merely late: over
    # 2026-08-01..04 the every-6-hours refresh (cron ':17') actually fired at :51, :34,
    # :54, :12, :03 and :51, hours from its slot, and the morning edition cron was
    # dropped outright on the 3rd and the 4th. Asking that scheduler to hit 13:07 UTC
    # was the bug. No number of extra precise crons fixes an unreliable clock.
    #
    # pipeline/editorial-gate.mjs is already state-based rather than clock-based: it
    # refuses before 9am Eastern and refuses again once the day's receipt exists. So an
    # hourly attempt is free (the gate exits in seconds) and the edition now publishes on
    # the first runner GitHub grants after 9am Eastern instead of waiting for a specific
    # minute that may never come.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Republish even if the repository receipt is current
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: mexico-brief-production-write
  cancel-in-progress: false

jobs:
  happening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Decide whether this edition is still due
        id: timing
        env:
          FORCE_PUBLICATION: ${{ github.event.inputs.force || 'false' }}
        run: node pipeline/editorial-gate.mjs

      - name: Install exact dependencies
        if: steps.timing.outputs.run == 'true'
        run: npm ci

      - name: Produce and validate one atomic edition
        if: steps.timing.outputs.run == 'true'
        id: edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBLICATION_SLOT: ${{ steps.timing.outputs.slot }}
          PUBLICATION_DATE: ${{ steps.timing.outputs.editorial_date }}
          PUBLICATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node pipeline/publish-edition.mjs

      - name: Commit the one publication result
        if: steps.timing.outputs.run == 'true'
        env:
          PUBLICATION_STATE: ${{ steps.edition.outputs.state }}
          STAGING_SAFE: ${{ steps.edition.outputs.staging_safe }}
          PUBLICATION_DATE: ${{ steps.timing.outputs.editorial_date }}
        run: |
          git config user.name  "mexico-data-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ "$PUBLICATION_STATE" = "published" ]; then
            git add data/news/ data/happening.json data/event-status.json data/brief.json data/publication-status.json data/llm-spend.json data/es/
          elif [ "$PUBLICATION_STATE" = "deferred" ] && [ "$STAGING_SAFE" = "true" ]; then
            git add data/news/ data/happening.json data/event-status.json data/publication-status.json data/llm-spend.json
          else
            git add data/publication-status.json data/llm-spend.json
          fi
          if git diff --cached --quiet; then
            echo "no publication-state change"
            exit 0
          fi
          git commit -m "publication: ${PUBLICATION_DATE} ${PUBLICATION_STATE}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          exit 1

      # A blocked receipt is committed first. The hourly gate and independent watchdog
      # then stop repeating the same code or infrastructure failure. This is the one alert.
      - name: Report a code or infrastructure block once
        if: steps.timing.outputs.run == 'true' && steps.edition.outputs.state == 'blocked'
        run: exit 1

      - name: Require the exact published edition to be live
        if: steps.timing.outputs.run == 'true' && steps.edition.outputs.state == 'published'
        id: live
        continue-on-error: true
        env:
          PUBLICATION_SLOT: ${{ steps.timing.outputs.slot }}
          PUBLICATION_DATE: ${{ steps.timing.outputs.editorial_date }}
          PUBLICATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node pipeline/verify-production.mjs

      - name: Retrigger one stale deployment
        if: steps.timing.outputs.run == 'true' && steps.edition.outputs.state == 'published' && steps.live.outcome == 'failure'
        env:
          PUBLICATION_SLOT: ${{ steps.timing.outputs.slot }}
          PUBLICATION_DATE: ${{ steps.timing.outputs.editorial_date }}
          PUBLICATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git commit --allow-empty -m "publication: retry ${PUBLICATION_DATE} deployment"
          git push origin HEAD:main
          node pipeline/verify-production.mjs
