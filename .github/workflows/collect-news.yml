name: collect-news
on:
  schedule:
    - cron: '5 */6 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: mexico-brief-production-write
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Collect without model calls
        id: collect
        continue-on-error: true
        run: node pipeline/collect-news.js
      - name: Persist valid collection and attempt health
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name mexico-data-bot
          git config user.email actions@users.noreply.github.com
          gh auth setup-git
          git add data/news/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[CF-Pages-Skip] news: collection and source health"
          git push origin HEAD:main
      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
